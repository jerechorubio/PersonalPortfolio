<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Sent! — Dev &amp; Leader</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%239D50BB'/><text x='5' y='24' font-size='19' fill='%23FCD116'>⚡</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700;800&family=Lexend+Mega:wght@800;900&display=swap" rel="stylesheet" />
 
  <style>
    /* ── Variables ── */
    :root {
      --bg:   #0D0D0D;
      --p1:   #9D50BB;
      --p2:   #6E48AA;
      --p3:   #B06CE0;
      --y:    #FCD116;
      --text: #F2F2F2;
      --text2:#A8A8A8;
    }
 
    * { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Lexend', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
 
    /* ── Animated Background ── */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(157,80,187,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(157,80,187,0.06) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
      z-index: 0;
    }
 
    @keyframes gridMove {
      0%   { transform: translateY(0); }
      100% { transform: translateY(50px); }
    }
 
    /* ── Orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(157,80,187,0.18) 0%, transparent 70%);
      top: -100px; right: -100px;
      animation: orbFloat 8s ease-in-out infinite;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(110,72,170,0.14) 0%, transparent 70%);
      bottom: -80px; left: -80px;
      animation: orbFloat 11s ease-in-out infinite reverse;
    }
    .orb-3 {
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(252,209,22,0.08) 0%, transparent 70%);
      top: 40%; left: 10%;
      animation: orbFloat 14s ease-in-out infinite 2s;
    }
 
    @keyframes orbFloat {
      0%,100% { transform: translate(0,0); }
      33%      { transform: translate(20px,-30px); }
      66%      { transform: translate(-15px,20px); }
    }
 
    /* ── Particles ── */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      animation: particleFall linear infinite;
      opacity: 0;
    }
    @keyframes particleFall {
      0%   { transform: translateY(-20px) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.5; }
      100% { transform: translateY(100vh) scale(1); opacity: 0; }
    }
 
    /* ── Main Card ── */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(26,26,26,0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(157,80,187,0.3);
      border-radius: 32px;
      padding: 3.5rem 3rem;
      max-width: 520px;
      width: 90%;
      text-align: center;
      box-shadow:
        0 0 40px rgba(157,80,187,0.25),
        0 0 80px rgba(110,72,170,0.1),
        inset 0 1px 0 rgba(255,255,255,0.05);
      animation: cardIn 0.8s cubic-bezier(0.22,1,0.36,1) both;
    }
 
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
 
    /* ── Check Icon ── */
    .check-wrap {
      width: 90px; height: 90px;
      background: linear-gradient(135deg, rgba(157,80,187,0.2), rgba(110,72,170,0.2));
      border: 2px solid rgba(157,80,187,0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.75rem;
      position: relative;
      animation: checkPop 0.6s cubic-bezier(0.22,1,0.36,1) 0.3s both;
    }
 
    @keyframes checkPop {
      from { transform: scale(0) rotate(-180deg); opacity: 0; }
      to   { transform: scale(1) rotate(0deg); opacity: 1; }
    }
 
    .check-wrap::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(157,80,187,0.2);
      animation: ripple 2s ease-out infinite;
    }
 
    .check-wrap::after {
      content: '';
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      border: 1px solid rgba(157,80,187,0.1);
      animation: ripple 2s ease-out infinite 0.4s;
    }
 
    @keyframes ripple {
      0%   { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }
 
    .check-icon {
      font-size: 2.4rem;
      animation: iconPop 0.4s cubic-bezier(0.22,1,0.36,1) 0.7s both;
    }
 
    @keyframes iconPop {
      from { transform: scale(0); }
      to   { transform: scale(1); }
    }
 
    /* ── Tag ── */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(252,209,22,0.1);
      border: 1px solid rgba(252,209,22,0.3);
      border-radius: 30px;
      padding: 5px 14px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--y);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
      animation: fadeUp 0.6s ease 0.5s both;
    }
 
    .tag-dot {
      width: 6px; height: 6px;
      background: var(--y);
      border-radius: 50%;
      animation: blink 1s step-end infinite;
    }
 
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
 
    /* ── Heading ── */
    .heading {
      font-family: 'Lexend Mega', sans-serif;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 0.75rem;
      animation: fadeUp 0.6s ease 0.6s both;
    }
 
    .heading .grad {
      background: linear-gradient(135deg, #9D50BB, #6E48AA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
 
    .heading .yl { color: var(--y); }
 
    /* ── Sub text ── */
    .subtext {
      color: var(--text2);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 2rem;
      animation: fadeUp 0.6s ease 0.7s both;
    }
 
    /* ── Divider ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(157,80,187,0.4), transparent);
      margin-bottom: 2rem;
      animation: fadeUp 0.6s ease 0.75s both;
    }
 
    /* ── Countdown ── */
    .countdown-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
      animation: fadeUp 0.6s ease 0.8s both;
    }
 
    .countdown-label {
      font-size: 0.78rem;
      color: var(--text2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
    }
 
    /* ── Number display ── */
    .countdown-num {
      font-family: 'Lexend Mega', sans-serif;
      font-size: 4rem;
      font-weight: 900;
      color: var(--y);
      line-height: 1;
      position: relative;
      width: 100px; height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 20px rgba(252,209,22,0.5));
    }
 
    /* Circular progress ring */
    .ring-svg {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }
 
    .ring-track {
      fill: none;
      stroke: rgba(157,80,187,0.15);
      stroke-width: 4;
    }
 
    .ring-fill {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 283;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }
 
    .num-text {
      position: relative;
      z-index: 1;
      transition: all 0.3s cubic-bezier(0.22,1,0.36,1);
    }
 
    .num-text.pop {
      animation: numPop 0.4s cubic-bezier(0.22,1,0.36,1);
    }
 
    @keyframes numPop {
      0%   { transform: scale(1.4); }
      100% { transform: scale(1); }
    }
 
    /* Progress bar */
    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 0.5rem;
    }
 
    .progress-bar-fill {
      height: 100%;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--p2), var(--p1), var(--y));
      width: 100%;
      transform-origin: left;
      transition: transform 1s linear;
    }
 
    /* ── Redirect text ── */
    .redirect-text {
      font-size: 0.82rem;
      color: var(--text2);
    }
 
    .redirect-text span {
      color: var(--p3);
      font-weight: 600;
    }
 
    /* ── Back Button ── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #9D50BB, #6E48AA);
      color: #fff;
      border-radius: 50px;
      font-family: 'Lexend', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(157,80,187,0.4);
      animation: fadeUp 0.6s ease 0.9s both;
      margin-top: 0.5rem;
      cursor: pointer;
      border: none;
    }
 
    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(157,80,187,0.6);
    }
 
    /* ── Footer tag ── */
    .footer-tag {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      color: rgba(157,80,187,0.5);
      font-style: italic;
      white-space: nowrap;
      z-index: 10;
    }
 
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
 
 
  </style>
</head>
<body>
 
  <!-- Background -->
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="particles" id="particles"></div>
 
  <!-- Main Card -->
  <div class="card">
 
    <!-- Check Icon -->
    <div class="check-wrap">
      <span class="check-icon">✅</span>
    </div>
 
    <!-- Tag -->
    <div class="tag">
      <span class="tag-dot"></span>
      Message Delivered
    </div>
 
    <!-- Heading -->
    <h1 class="heading">
      <span class="grad">Thank</span> <span class="yl">You!</span>
    </h1>
 
    <!-- Sub -->
    <p class="subtext">
      Your message has been sent successfully.<br />
      I'll get back to you as soon as possible. 💜
    </p>
 
    <div class="divider"></div>
 
    <!-- Countdown -->
    <div class="countdown-wrap">
      <span class="countdown-label">Redirecting you back in</span>
 
      <!-- Circular ring countdown -->
      <div class="countdown-num">
        <svg class="ring-svg" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#6E48AA"/>
              <stop offset="100%" stop-color="#FCD116"/>
            </linearGradient>
          </defs>
          <circle class="ring-track" cx="50" cy="50" r="45"/>
          <circle class="ring-fill" id="ringFill" cx="50" cy="50" r="45"/>
        </svg>
        <span class="num-text" id="countNum">5</span>
      </div>
 
      <!-- Linear progress bar -->
      <div style="width:100%;animation:fadeUp .6s ease .85s both;">
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <p class="redirect-text" style="margin-top:.5rem;">
          Going back to <span>portfolio</span>…
        </p>
      </div>
    </div>
 
    <!-- Manual back button -->
    <a href="https://personal-portfolio-psi-gilt-42.vercel.app" class="back-btn" id="backBtn">
      ← Go Back Now
    </a>
 
  </div>
 
  <!-- Footer -->
  <p class="footer-tag">⚡ Dev / Leader Portfolio — Merging Systems with Leadership</p>
 
  <script>
    const REDIRECT_URL = 'https://personal-portfolio-psi-gilt-42.vercel.app';
    const TOTAL = 5;
 
    /* ── Countdown ── */
    const numEl      = document.getElementById('countNum');
    const ringFill   = document.getElementById('ringFill');
    const progressBar= document.getElementById('progressBar');
    const CIRCUMFERENCE = 2 * Math.PI * 45; // ≈ 282.7
 
    ringFill.style.strokeDasharray  = CIRCUMFERENCE;
    ringFill.style.strokeDashoffset = 0;
 
    let count = TOTAL;
 
    function updateRing(remaining) {
      const pct    = remaining / TOTAL;
      const offset = CIRCUMFERENCE * (1 - pct);
      ringFill.style.strokeDashoffset = offset;
      progressBar.style.transform = `scaleX(${pct})`;
    }
 
    function tick() {
      // Pop animation on number
      numEl.classList.remove('pop');
      void numEl.offsetWidth; // reflow
      numEl.classList.add('pop');
      numEl.textContent = count;
 
      updateRing(count);
 
      if (count <= 0) {
        window.location.href = REDIRECT_URL;
        return;
      }
      count--;
      setTimeout(tick, 1000);
    }
 
    // Start after card animates in
    setTimeout(tick, 900);
 
    /* ── Floating particles ── */
    const particlesEl = document.getElementById('particles');
    const colors = ['#9D50BB', '#6E48AA', '#FCD116', '#B06CE0', '#FFB300'];
 
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 5 + 2;
      p.style.cssText = `
        width: ${size}px;
        height: ${size}px;
        left: ${Math.random() * 100}%;
        top: ${Math.random() * 100}%;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        animation-duration: ${Math.random() * 8 + 6}s;
        animation-delay: ${Math.random() * 5}s;
      `;
      particlesEl.appendChild(p);
    }
 
 
  </script>
 
</body>
</html>
